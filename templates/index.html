
<!DOCTYPE html>
<html lang="en">
<head>
    <title>Road Segmentation Detection</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="icon" type="image/png" href="static/images/icons/favicon.ico"/>
    <link rel="stylesheet" type="text/css" href="static/vendor/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" type="text/css" href="static/fonts/font-awesome-4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" type="text/css" href="static/vendor/animate/animate.css">
    <link rel="stylesheet" type="text/css" href="static/vendor/css-hamburgers/hamburgers.min.css">
    <link rel="stylesheet" type="text/css" href="static/vendor/select2/select2.min.css">
    <link rel="stylesheet" type="text/css" href="static/css/util.css">

    <link rel="stylesheet" type="text/css" href="static/css/main.css">

    <style>
        /* RoadVision AI - Purple Login Theme */

        body {
            background: #080b1a;
            font-family: 'Inter', sans-serif;
        }

        .limiter,
        .container-login100 {
            background: #080b1a !important;
        }

        .wrap-login100 {
            background: #111a30 !important;
            border: 1px solid #35245c;
            border-radius: 22px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
            overflow: hidden;
        }

        .login100-form-title {
            color: #ffffff !important;
            font-weight: 800;
        }

        .input100 {
            background: #0b1224 !important;
            color: #ffffff !important;
            border: 1px solid #393052 !important;
            border-radius: 30px !important;
        }

        .input100::placeholder {
            color: #9ba4ba !important;
        }

        .input100:focus {
            border-color: #b65cff !important;
        }

        .symbol-input100 {
            color: #b65cff !important;
        }

        .login100-form-btn {
            background: linear-gradient(90deg, #7138d8, #bd5cff) !important;
            color: white !important;
            border: none;
            border-radius: 30px !important;
            font-weight: 700;
            transition: 0.3s;
        }

        .login100-form-btn:hover {
            box-shadow: 0 8px 25px rgba(182, 92, 255, 0.3);
            transform: translateY(-2px);
        }

        .txt2 {
            color: #bd8aff !important;
        }

        .txt2:hover {
            color: #ffffff !important;
        }

        .login100-pic img {
            max-width: 100%;
        }

        /* Footer styling */

        .page-footer {
            background: #080b1a;
            border-top: 1px solid #35245c;
            text-align: center;
            padding: 22px 10px;
            color: #93a4bb;
            font-size: 13px;
            position: relative;
            z-index: 10;
        }

        .page-footer span {
            color: #bd5cff;
            font-weight: 700;
        }

        .page-footer p {
            margin: 7px 0 0;
            font-size: 11px;
        }

        @media(max-width: 768px) {
            .wrap-login100 {
                padding: 30px 20px;
            }
        }
    </style>
</head>

<body>

    <div class="limiter">
        <div class="container-login100" id="card">

            <div class="front">
                <div class="container-login100">
                    <div class="wrap-login100">

                        <div class="login100-pic js-tilt" data-tilt>
                            <img src="static/images/ccfd.png" alt="IMG">
                        </div>

                        <form class="login100-form validate-form" method="POST" id="l" action="/dashboard">

                            <span class="login100-form-title">
                                Login
                            </span>

                            <div class="wrap-input100 validate-input" data-validate="Valid email is required: ex@abc.xyz">
                                <input class="input100 l" type="email" name="emaill" id="emaill" placeholder="Email">
                                <span class="focus-input100"></span>
                                <span class="symbol-input100">
                                    <i class="fa fa-envelope" aria-hidden="true"></i>
                                </span>
                            </div>

                            <div class="wrap-input100 validate-input" data-validate="Password is required">
                                <input class="input100 l" type="password" name="passl" id="passl" placeholder="Password">
                                <span class="focus-input100"></span>
                                <span class="symbol-input100">
                                    <i class="fa fa-lock" aria-hidden="true"></i>
                                </span>
                            </div>

                            <div class="container-login100-form-btn">
                                <button class="login100-form-btn">
                                    Login
                                </button>
                            </div>

                            <div class="text-center p-t-12" style="display:none;" id="upnf1">
                                <span class="txt1">
                                    <span class="alert-validate" style="position: relative;"></span>
                                    Username / Password doesn't match
                                </span>
                            </div>

                            <div class="text-center p-t-136">
                                <a class="txt2" href="javascript:togLogReg('1')">
                                    Create your Account
                                    <i class="fa fa-long-arrow-right m-l-5" aria-hidden="true"></i>
                                </a>
                            </div>

                        </form>
                    </div>
                </div>
            </div>

            <div class="back">
                <div class="container-login100">
                    <div class="wrap-login100">

                        <form class="login100-form validate-form" method="POST" id="r">

                            <span class="login100-form-title">
                                Register
                            </span>

                            <div class="wrap-input100 validate-input" data-validate="Valid email is required: ex@abc.xyz">
                                <input class="input100 r" type="email" name="emailr" id="emailr" placeholder="Email">
                                <span class="focus-input100"></span>
                                <span class="symbol-input100">
                                    <i class="fa fa-envelope" aria-hidden="true"></i>
                                </span>
                            </div>

                            <div class="wrap-input100 validate-input" data-validate="Name is required">
                                <input class="input100 r" type="text" name="usernamer" id="usernamer" placeholder="Name">
                                <span class="focus-input100"></span>
                                <span class="symbol-input100">
                                    <i class="fa fa-userZZ" aria-hidden="true"></i>
                                </span>
                            </div>

                            <div class="wrap-input100 validate-input" data-validate="Password is required">
                                <input class="input100 r" type="password" name="passr" id="passr" placeholder="Password">
                                <span class="focus-input100"></span>
                                <span class="symbol-input100">
                                    <i class="fa fa-lock" aria-hidden="true"></i>
                                </span>
                            </div>

                            <div class="wrap-input100 validate-input" data-validate="Password must match">
                                <input class="input100 r" type="password" name="rpassr" id="rpassr" placeholder="Re-Password">
                                <span class="focus-input100"></span>
                                <span class="symbol-input100">
                                    <i class="fa fa-lock" aria-hidden="true"></i>
                                </span>
                            </div>

                            <div class="container-login100-form-btn">
                                <button class="login100-form-btn">
                                    Register
                                </button>
                            </div>

                            <div class="text-center p-t-12" style="display:none;" id="upnf">
                                <span class="txt1">
                                    <span class="alert-validate" style="position: relative;"></span>
                                    Username already exist, please try another one
                                </span>
                            </div>

                            <div class="text-center p-t-12" style="display:none;" id="pnm">
                                <span class="txt1">
                                    <span class="alert-validate" style="position: relative;"></span>
                                    Password didnt match
                                </span>
                            </div>

                            <div class="text-center p-t-136">
                                <a class="txt2" href="javascript:togLogReg('1')">
                                    Already have an account? Login.
                                    <i class="fa fa-long-arrow-right m-l-5" aria-hidden="true"></i>
                                </a>
                            </div>

                        </form>

                        <div class="login100-pic js-tilt" data-tilt>
                            <img src="static/images/ccfd.png" alt="IMG">
                        </div>

                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- Footer -->
    <footer class="page-footer">
        Designed &amp; Developed by
        <span>Umme Haney Sallauddin</span>
        <p>© 2026 RoadVision AI | All Rights Reserved</p>
    </footer>

    <script src="static/vendor/jquery/jquery-3.2.1.min.js"></script>
    <script src="static/js/jquery.flip.js"></script>
    <script src="static/vendor/bootstrap/js/popper.js"></script>
    <script src="static/vendor/bootstrap/js/bootstrap.min.js"></script>
    <script src="static/vendor/select2/select2.min.js"></script>
    <script src="static/vendor/tilt/tilt.jquery.min.js"></script>
    <script src="static/js/main.js"></script>

    <script>
        $('.js-tilt').tilt({
            scale: 1.1
        });

        $(document).ready(function(){
            $("#card").flip({
                trigger: 'manual'
            });
        });

        function checkLogin(type,isErr){
            var email = $("#email"+type).val();
            var pass = $("#pass"+type).val();
            console.log(isErr);

            if(isErr)
                return;

            console.log(type);

            if(type=="r"){
                var username = $("#username"+type).val();
                let rpass = $("#rpass"+type).val();

                $.post("/",{
                    reqst: type,
                    email: email,
                    pass: pass,
                    username: username
                })
                .done(function(data){
                    console.log(data);
                    if(data==1){
                        $("#card").flip('toggle');
                    }
                });
            } else {
                $.post("/",{
                    reqst: type,
                    email: email,
                    pass: pass
                })
                .done(function(data){
                    console.log(data);
                    if(data=="-1"){
                        $("#upnf1").show();
                        return -1;
                    } else {
                        return 1;
                    }
                }).delay(2000);
            }
        }

        function togLogReg(id){
            $("#card").flip('toggle');
        }
    </script>

</body>
</html>
