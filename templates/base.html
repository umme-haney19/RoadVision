
<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}RoadVision AI{% endblock title %}</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
          rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        body {
            background: #080f1e;
            color: #e8eef8;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
        }

        .navbar {
            background: #0d1729;
            border-bottom: 1px solid #30204b;
            padding: 17px 7%;
        }

        .navbar-brand {
            color: #ffffff !important;
            font-size: 20px;
            font-weight: 800;
        }

        .navbar-brand i {
            color: #b56cff;
            margin-right: 10px;
        }

        .signout-link {
            color: #b9a6d9 !important;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            transition: 0.3s;
        }

        .signout-link:hover {
            color: #c084fc !important;
        }
        .page-footer {
    background: #080b1a;
    border-top: 1px solid #35245c;
    text-align: center;
    padding: 22px 10px;
    color: #93a4bb;
    font-size: 13px;
    margin-top: 30px;
}

.page-footer span {
    color: #bd5cff;
    font-weight: 700;
}

.page-footer p {
    margin: 7px 0 0;
    font-size: 11px;
}
    </style>
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container-fluid">

            <a class="navbar-brand" href="/dashboard">
                <i class="fa-solid fa-road"></i>
                RoadVision AI
            </a>

            <a class="signout-link" href="{{ url_for('index') }}">
                <i class="fa-solid fa-right-from-bracket me-2"></i>
                Sign Out
            </a>

        </div>
    </nav>

    {% block body %}
{% endblock body %}

<footer class="page-footer">
    Designed &amp; Developed by
    <span>Umme Haney Sallauddin</span>
    <p>© 2026 RoadVision AI | All Rights Reserved</p>
</footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
